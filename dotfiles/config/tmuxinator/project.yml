# ~/.tmuxinator/project.yml
<% if @args[0] %>
<% WDIR=@args[0] %> 
<% else %>
<% WDIR=ENV["PWD"] %>
<% end %>

name: <%= WDIR.split('/').last  %>
root: <%= WDIR %>

# Get layout with: tmux list-windows -t <session-name> -F "#{window_index}: #{window_layout}"
windows:
  - main:
      layout: 3fed,319x80,0,0{180x80,0,0,2,138x80,181,0[138x50,181,0,4,138x29,181,51,5]}
      panes:
        - editor: vim
        - claude: claude-personal
        - shell: zsh
