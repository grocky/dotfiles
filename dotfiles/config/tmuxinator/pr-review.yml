# ~/.config/tmuxinator/pr-review.yml
#
# Review a pull request in a session rooted in its own worktree.
#   mux start pr-review <worktree-dir> [pr-number]
# `ghpr` creates the worktree and calls this; the pr number is only used to
# label the review window's commands, so a bare `gh pr view` (which resolves
# the PR from the checked out branch) is a fine fallback.
<% if @args[0] %>
<% WDIR=@args[0] %>
<% else %>
<% WDIR=ENV["PWD"] %>
<% end %>
<% PR=@args[1] %>

name: <%= WDIR.split('/').last %>
root: <%= WDIR %>

# Get layout with: tmux list-windows -t <session-name> -F "#{window_index}: #{window_layout}"
windows:
  - main:
      layout: 3fed,319x80,0,0{180x80,0,0,2,138x80,181,0[138x50,181,0,4,138x29,181,51,5]}
      panes:
        - editor: vim
        - agent: claude_bedrock
        - shell: zsh
  - review:
      layout: even-horizontal
      panes:
        - overview: gh pr view <%= PR %>
        - diff: gh pr diff <%= PR %>
