# ~/.config/tmuxinator/pr-review.yml
#
# Review a pull request in a session rooted in its own worktree.
#   mux start pr-review <worktree-dir> [pr-number]
# `ghpr` creates the worktree and calls this. The pr number is only used by the
# `gh` panes, and they resolve the PR from the checked out branch when it is
# missing, so a bare `mux start pr-review <dir>` still works.
<% if @args[0] %>
<% WDIR=@args[0] %>
<% else %>
<% WDIR=ENV["PWD"] %>
<% end %>
<% PR=@args[1] %>

name: <%= WDIR.split('/').last %>
root: <%= WDIR %>

# Get layout with: tmux list-windows -t <session-name> -F "#{window_index}: #{window_layout}"
windows:
  - main:
      layout: 76aa,252x67,0,0{186x67,0,0,34,65x67,187,0[65x43,187,0,36,65x23,187,44,37]}
      panes:
        - review: nvim -c 'Octo review'
        - agent: claude_bedrock
        - shell: zsh
  - pr:
      layout: even-horizontal
      panes:
        - overview: gh pr view <%= PR %>
        - checks: gh pr checks <%= PR %>
